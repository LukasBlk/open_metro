<!DOCTYPE html>

<style>
:root{--water:#c3dcec;--bg:#f4f1ea;--fg:#2a2a2a;--bar:#e6e1d5;--st:#fff;--bd:#c9c3b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--water:#2b4a62;--bg:#1c1d20;--fg:#e8e6e1;--bar:#2a2b30;--st:#1c1d20;--bd:#444650}}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tr:not(.empty){color:#fff}}

#ob{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

#ob button#rs:hover{background:var(--st);color:var(--fg)}
#clock{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;user-select:none}
#cinfo{font-weight:600;font-size:13px}

@media (max-width:640px){.dy{width:24px;height:24px;font-size:9px}#days{gap:3px}}
#rw{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#rwc{background:var(--bar);color:var(--fg);padding:24px 30px;border-radius:18px;border:1px solid var(--bd);text-align:center;display:flex;flex-direction:column;gap:6px}
#rwt{font-size:24px;font-weight:700}
#rwn{font-size:15px;font-weight:600;margin-top:4px}
#rws{font-size:15px;opacity:.75;margin-top:10px}
#rwb{display:flex;gap:14px;margin-top:14px;justify-content:center}
.rb{width:88px;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:0}
.rb:hover{background:var(--bd)}

#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px))}

#mt{font-size:clamp(40px,9vw,76px);font-weight:800;letter-spacing:-1px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

button{transition:background .15s,box-shadow .15s,border-color .15s,color .15s}
#lang{display:flex;gap:8px;align-items:center;font-size:14px}#lang span{opacity:.6;margin-right:4px}#lang button{font:inherit;padding:6px 12px;border-radius:8px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.6}#lang button.on{opacity:1;font-weight:700}
#credit{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.5;pointer-events:none;z-index:50;text-align:right}
#ver{position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.5;pointer-events:none;z-index:50}
</style></head><body>
<canvas id="cv"></canvas>
<div id="clock"><div id="cinfo"></div><div id="crow"><div id="days"></div><div id="spd"></div></div></div>
<button id="mb">Menu</button>
<div id="left" class="side"></div><div id="right" class="side"></div>
<div id="msg" data-def="1">Pick a line on the right and drag between stations. Drag trains from the left panel onto a line.</div>
<div id="over"><div id="ot"></div><div id="ob"><button id="rs">Hrát znovu</button><button id="rm">Menu</button></div></div>
<div id="rw"><div id="rwc"><div id="rwt">Week completed!</div><div id="rwn">You received a new locomotive</div><div id="rws">Choose reward</div><div id="rwb"></div></div></div>
<div id="ver">v0.38</div>
<div id="credit">Made by BLK in Czech Republic - 2026</div>
<div id="menu"><div id="mt">OpenMetro</div><div id="mlv"></div><div id="lang"></div></div>
<script>
const COL=['#e0453a','#2b7bd6','#2fa05a','#f08a24','#8e4fc4','#e05fa0','#1fb5b0','#8b5a2b','#c9a800','#34408f'],MAXL=10,CAP=8,VMAX=110,ACC=240,VMIN=14,R=15,MAXS=10;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),bar=document.getElementById('bar');
let W,H,S,adj,paused=false,last=0,FDT=.016,DPR=1,cam={x:0,y:0,z:1},pan=null;
function resize(){const d=DPR=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);if(S&&S.lines)ui()}
addEventListener('resize',resize);
new ResizeObserver(resize).observe(cv);
const pos=s=>[s.fx*W,s.fy*H];

function reset(){
  S={t:0,score:0,stations:[],lines:COL.slice(0,3).map((c,i)=>({i,c,st:[],trains:[]})),pool:3,sel:0,spawnP:1,spawnS:20,poolT:0,over:false,ghosts:[],fx:[],weeksDone:0,reward:false,tunnels:2};
  for(let i=0;i<4;i++)addStation(true);
  segAnim.clear();buildAdj();document.getElementById('over').style.display='none';document.getElementById('rw').style.display='none';ui();
}
function addStation(init){
  const n=S.stations.length,act=n>=6?['c','t','s','d']:['c','t','s'];
  for(let k=0;k<80;k++){
    const fx=init?.3+Math.random()*.4:.12+Math.random()*.76,fy=init?.3+Math.random()*.4:.1+Math.random()*.8;
    if((S.stations.every(o=>Math.hypot((o.fx-fx)*W,(o.fy-fy)*H)>(init?90:120))&&!nearWater(fx*W,fy*H))||k==79){
      S.stations.push({fx,fy,shape:n<3?act[n]:act[Math.floor(Math.random()*act.length)],pax:[],over:0});return}
  }
}
function buildAdj(){
  adj=S.stations.map(()=>new Set());
  for(const L of S.lines)for(let i=0;i<nseg(L);i++){const a=L.st[i],b=sb(L,i);adj[a].add(b);adj[b].add(a)}
}
// pomocné funkce pro linky a smyčky
function nseg(L){const n=L.st.length;return n<2||L.dying?0:L.loop?n:n-1}
function sb(L,i){return L.st[(i+1)%L.st.length]}
function adjIdx(L,x,y){const n=L.st.length,d=Math.abs(x-y);return d===1||(!!L.loop&&n>2&&d===n-1)}
function nearOn(p,mx,my){
  let best=null,acc=0;const tot=plen(p)||1;
  for(let k=0;k<p.length-1;k++){
    const a=p[k],b=p[k+1],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy,l=Math.sqrt(l2);
    if(l<1e-6)continue;
    const t=Math.max(0,Math.min(1,((mx-a[0])*dx+(my-a[1])*dy)/l2)),cx=a[0]+dx*t,cy=a[1]+dy*t,d=Math.hypot(mx-cx,my-cy);
    if(!best||d<best.d)best={d,f:(acc+l*t)/tot,side:Math.sign(dx*(my-cy)-dy*(mx-cx)),x:cx,y:cy,ang:Math.atan2(dy,dx)};
    acc+=l;
  }
  return best;
}
function lineAt(mx,my,maxD){
  let best=null;
  for(const L of S.lines)for(let i=0;i<nseg(L);i++){
    const r=nearOn(route(L,L.st[i],sb(L,i)),mx,my);
    if(r&&r.d<maxD&&(!best||r.d<best.d))best={...r,L,i};
  }
  return best;
}
function placeOn(tr,h,old){
  const st=h.L.st,fwd=h.side>=0,i=h.i,f=Math.max(.02,Math.min(.98,h.f));
  const nb=sb(h.L,i);endGhost(tr);
  tr.a=fwd?st[i]:nb;tr.b=fwd?nb:st[i];tr.t=fwd?f:1-f;tr.wait=0;tr.rm=false;
  if(old!==h.L){if(old)old.trains.splice(old.trains.indexOf(tr),1);h.L.trains.push(tr)}
}
function endPv(d){
  const h=d.hit;
  if(d.tr){
    d.tr.held=false;
    if(d.moved){d.tr.rm=true;if(h){const st=h.L.st,fwd=h.side>=0,i=h.i,f=Math.max(.02,Math.min(.98,h.f));{const nb=sb(h.L,i);d.tr.mv={L:h.L,a:fwd?st[i]:nb,b:fwd?nb:st[i],t:fwd?f:1-f}}}else d.tr.mv=null}
  }else if(h&&S.pool>0){placeOn({pax:[]},h,null);S.pool--}
  ui();
}
function validMv(m){const s=m.L.st,x=s.indexOf(m.a),y=s.indexOf(m.b);return x>=0&&y>=0&&adjIdx(m.L,x,y)}
function endGhost(tr){const G=tr.g;tr.g=null;if(G&&--G.n<=0)S.ghosts=S.ghosts.filter(x=>x!==G)}
function dseg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function segAt(mx,my){
  let best=null,bd=11;
  for(const L of S.lines)for(let i=0;i<nseg(L);i++){
    const p=route(L,L.st[i],sb(L,i));
    for(let k=0;k<p.length-1;k++){const d=dseg(mx,my,p[k],p[k+1]);if(d<bd){bd=d;best={L,i}}}
  }
  return best;
}
function insertSeg(h,X){
  const L=h.L,i=h.i,a=L.st[i],b=sb(L,i);
  if(L.st.includes(X))return;
  {const ns=L.st.slice();ns.splice(i+1,0,X);if(!canChange(L,ns,L.loop))return}
  L.st.splice(i+1,0,X);
  const G={L,a,b,n:0};
  for(const tr of L.trains){
    if(!((tr.a===a&&tr.b===b)||(tr.a===b&&tr.b===a))||tr.g)continue;
    if(tr.t>0){tr.g=G;G.n++}else tr.b=X;
  }
  if(G.n>0)S.ghosts.push(G);
}
// řeka a tunely
const RW=44;
let RIVERS=[];
function riverPts(){return RIVERS.map(r=>r.map(p=>[p[0]*W,p[1]*H]))}
function inWater(x,y,rp){for(const pl of rp)for(let k=0;k<pl.length-1;k++)if(dseg(x,y,pl[k],pl[k+1])<RW/2)return true;return false}
function nearWater(x,y){const rp=riverPts();for(const pl of rp)for(let k=0;k<pl.length-1;k++)if(dseg(x,y,pl[k],pl[k+1])<RW/2+28)return true;return false}
function crossings(p){
  const rp=riverPts();let n=0,prev=false;
  for(let k=0;k<p.length-1;k++){
    const a=p[k],b=p[k+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]),m=Math.max(1,Math.ceil(l/4));
    for(let s=0;s<=m;s++){const w=inWater(a[0]+(b[0]-a[0])*s/m,a[1]+(b[1]-a[1])*s/m,rp);if(w&&!prev)n++;prev=w}
  }
  return n>0?1:0; // jeden tunel na úsek mezi dvěma stanicemi, bez ohledu na počet přejezdů vody
}
function tunnelsUsed(ov,tmp){
  let u=0;
  for(const l0 of S.lines){const l=l0===ov?tmp:l0;for(let i=0;i<nseg(l);i++)u+=crossings(route(l,l.st[i],sb(l,i),true))}
  return u;
}
function canChange(L,st,loop){
  const cur=tunnelsUsed(),nu=tunnelsUsed(L,{i:L.i,st,loop});
  if(nu<=S.tunnels||nu<=cur)return true;
  msg(tr_('needT',nu-S.tunnels));return false;
}
function remReady(){return !!drag&&drag.remId>=0&&drag.hover!==drag.remId}
// odebrání stanice z linky
function removeSt(L,X){
  const n=L.st.length,i=L.st.indexOf(X);if(i<0)return;
  if(n<=2){
    for(const tr of L.trains){
      if(tr.t>0||tr.held){tr.rm=true;tr.mv=null}
      else{const s=S.stations[tr.a];if(s)for(const p of tr.pax){if(p.shape===s.shape)S.score++;else s.pax.push(p)}tr.pax=[];endGhost(tr);tr.dead=true;S.pool++}
    }
    L.trains=L.trains.filter(t=>!t.dead);
    if(L.trains.length)L.dying=true;
    else{L.st=[];L.loop=false;S.ghosts=S.ghosts.filter(g=>g.L!==L)}
    return;
  }
  {const ns0=L.st.filter(s=>s!==X);if(!canChange(L,ns0,L.loop&&ns0.length>=3))return}
  const end=!L.loop&&(i===0||i===n-1);
  const P=L.st[(i-1+n)%n],Q=L.st[(i+1)%n];
  const path=end?[i===0?L.st[1]:L.st[n-2],X]:[P,X,Q];
  const G={L,x:X,path,n:0};
  for(const tr of L.trains){
    if(tr.a!==X&&tr.b!==X)continue;
    if(tr.g)endGhost(tr);
    tr.g=G;G.n++;
  }
  L.st.splice(i,1);
  if(L.loop&&L.st.length<3)L.loop=false;
  if(G.n>0)S.ghosts.push(G);
}
// vlak jedoucí po staré trase kolem odebrané stanice
function moveGR(L,tr,dt){
  const G=tr.g,st=L.st;
  if(tr.wait>0){tr.wait-=dt;return}
  advance(tr,L,dt);
  if(tr.t<1)return;
  const B=tr.b,sB=S.stations[B];
  if(tr.rm){for(const p of tr.pax){if(p.shape===sB.shape)S.score++;else sB.pax.push(p)}tr.pax=[];endGhost(tr);tr.dead=true;const m=tr.mv;if(m&&validMv(m))m.L.trains.push({a:m.a,b:m.b,t:m.t,wait:0,pax:[]});else S.pool++;ui();return}
  if(B===G.x){
    const nxt=G.path.length===3?(tr.a===G.path[0]?G.path[2]:G.path[0]):tr.a;
    stop(tr,sB,nxt);
    tr.a=B;tr.b=nxt;tr.t=0;tr.v=0;tr.wait=.3;return;
  }
  const n=st.length,ib=st.indexOf(B);let nx;
  if(G.path.length===3){
    const prev=B===G.path[0]?G.path[2]:G.path[0],ia=st.indexOf(prev);
    if(L.loop){const d=(ib-ia+n)%n,dir=d===1?1:-1;nx=st[(ib+dir+n)%n]}
    else{const dr=Math.sign(ib-ia);nx=st[ib+dr]!==undefined?st[ib+dr]:st[ib-dr]}
  }else nx=ib===0?st[1]:st[n-2];
  stop(tr,sB,nx);
  endGhost(tr);tr.a=B;tr.b=nx;tr.t=0;tr.v=0;tr.wait=.8;
}
function nextHop(f,sh){
  const first=new Map([[f,null]]),q=[f];
  while(q.length){const u=q.shift();for(const v of adj[u]){
    if(first.has(v))continue;first.set(v,u===f?v:first.get(u));
    if(S.stations[v].shape===sh)return first.get(v);q.push(v)}}
  return null;
}
function spawnPax(){
  const shapes=[...new Set(S.stations.map(s=>s.shape))],s=S.stations[Math.floor(Math.random()*S.stations.length)];
  const opts=shapes.filter(x=>x!==s.shape);if(!opts.length)return;
  s.pax.push({shape:opts[Math.floor(Math.random()*opts.length)]});
}
function stop(tr,s,n){
  for(const p of [...tr.pax]){
    if(p.shape===s.shape){tr.pax.splice(tr.pax.indexOf(p),1);S.score++;if(p.lx!==undefined){const sp=pos(s);S.fx.push({shape:p.shape,x:p.lx,y:p.ly,tx:sp[0],ty:sp[1],r:p.pr||0,t:0})}continue}
    const h=nextHop(S.stations.indexOf(s),p.shape);
    if(h!==null&&h!==n){tr.pax.splice(tr.pax.indexOf(p),1);s.pax.push(p)}
  }
  for(const p of [...s.pax]){
    if(tr.pax.length>=CAP)break;
    if(nextHop(S.stations.indexOf(s),p.shape)===n){s.pax.splice(s.pax.indexOf(p),1);tr.pax.push(p)}
  }
}
function move(L,tr,dt){
  if(tr.held)return;
  if(tr.g&&tr.g.path){moveGR(L,tr,dt);return}
  const st=L.st;if(st.length<2){if(tr.g)endGhost(tr);return}
  const ia=st.indexOf(tr.a),ib=st.indexOf(tr.b);
  if(ia<0||ib<0||(!tr.g&&!adjIdx(L,ia,ib))){endGhost(tr);tr.a=st[0];tr.b=st[1];tr.t=0;tr.wait=0;return}
  if(tr.wait>0){tr.wait-=dt;return}
  advance(tr,L,dt);
  if(tr.t>=1){
    let nx;

  if(!n)return '<svg width="14" height="14" viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3" height="11" fill="currentColor"/><rect x="8.5" y="1.5" width="3" height="11" fill="currentColor"/></svg>';
  let p='';for(let i=0;i<n;i++)p+='<polygon points="'+(i*6)+',1 '+(i*6)+',13 '+(i*6+8)+',7" fill="currentColor"/>';
  const w=(n-1)*6+8;return '<svg width="'+w+'" height="14" viewBox="0 0 '+w+' 14">'+p+'</svg>';
}
const dayEls=DN.map(n=>{const d=document.createElement('div');d.className='dy';d.textContent=n;document.getElementById('days').appendChild(d);return d});
const spdEls=[0,1,2,3].map(n=>{const b=document.createElement('button');b.innerHTML=spdIcon(n);b.title=tr_('spd')[n];b.onclick=()=>setSpeed(n);document.getElementById('spd').appendChild(b);return b});
function setSpeed(n){if(n>0)lastSpeed=n;speed=n;paused=n===0;spdEls.forEach((b,i)=>b.classList.toggle('on',i===n))}
setSpeed(1);
// výběr odměny po dokončeném týdnu
function pickReward(k){
  if(k==='train')S.pool++;else if(k==='tunnel')S.tunnels++;
  else if(S.lines.length<MAXL)S.lines.push({i:S.lines.length,c:COL[S.lines.length],st:[],trains:[]});
  S.reward=false;
  {const rw=document.getElementById('rw');rw.classList.add('out');setTimeout(()=>{rw.style.display='none';rw.classList.remove('out')},220)}
  ui();
}
const rewardBtns=[];
[['train',TRAIN_SVG,'rTrain'],['tunnel',TUNNEL_SVG,'rTunnel'],['line',LINE_SVG,'rLine']].forEach(([k,svg,tk])=>{
  const b=document.createElement('button');b.className='rb';
  b.innerHTML=svg.replace('width="32" height="32"','width="52" height="52"');
  b.dataset.tk=tk;b.onclick=()=>pickReward(k);rewardBtns.push(b);
  document.getElementById('rwb').appendChild(b);
});
function clockUI(){
  const day=Math.floor(S.t/24),wd=day%7,wk=Math.floor(day/7)+1;
  document.getElementById('cinfo').textContent=tr_('clock',S.score,wk,day+1);
  dayEls.forEach((el,i)=>{el.style.setProperty('--p',(i<wd?100:i===wd?(S.t%24)/24*100:0).toFixed(1)+'%');el.classList.toggle('cur',i===wd)});
}
function clearLine(L){S.pool+=L.trains.length;L.trains=[];L.st=[];L.loop=false;L.dying=false;S.ghosts=S.ghosts.filter(g=>g.L!==L);buildAdj();ui()}
// úvodní menu a levely (řeky jsou v poměrných souřadnicích 0–1)
let inMenu=true;
const LEVELS=[
  {name:'Desert',rivers:[]},
  {name:'Milom',rivers:[[[-.05,.68],[.2,.6],[.38,.64],[.55,.45],[.75,.4],[1.05,.48]]]},
  {name:'Ausig',rivers:[[[1.04,.18],[.95,.176],[.9,.189],[.85,.233],[.8,.269],[.75,.304],[.69,.339],[.625,.361],[.565,.37],[.52,.379],[.48,.401],[.458,.441],[.445,.493],[.448,.564],[.458,.634],[.47,.705],[.475,.775],[.488,.846],[.515,.916],[.545,.969],[.565,1],[.58,1.05]]]}
];
function drawPreview(c,lv){
  const x=c.getContext('2d'),w=c.width,h=c.height,wc=getComputedStyle(document.documentElement).getPropertyValue('--water').trim();
  x.clearRect(0,0,w,h);x.strokeStyle=wc;x.lineWidth=w*.09;x.lineCap='butt';x.lineJoin='round';
  for(const r of lv.rivers){x.beginPath();r.forEach((p,k)=>x[k?'lineTo':'moveTo'](p[0]*w,p[1]*h));x.stroke()}
}
const lvCanvases=[];
function buildMenu(){
  const box=document.getElementById('mlv');
  {const lg=document.getElementById('lang');lg.innerHTML='<span id="langt"></span>';
   [['en','English'],['cs','Čeština']].forEach(([l,n])=>{const b=document.createElement('button');b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);lg.appendChild(b)})}
  LEVELS.forEach((lv,i)=>{
    const b=document.createElement('button');b.className='lv';
    const c=document.createElement('canvas');c.width=300;c.height=300;
    const s=document.createElement('span');s.textContent=lv.name;
    b.append(c,s);b.onclick=()=>startLevel(i);box.appendChild(b);lvCanvases.push(c);
  });
}
function applyLang(){
  document.documentElement.lang=LANG;document.title=tr_('title');
  const set=(id,k)=>{const e=document.getElementById(id);if(e)e.textContent=tr_(k)};
  set('mb','menu');set('rm','menu');set('rs','again');set('rwt','wk');set('rwn','newloc');set('rws','choose');
  rewardBtns.forEach(b=>{const t=tr_(b.dataset.tk);b.title=t;b.setAttribute('aria-label',t)});
  dayEls.forEach((el,i)=>el.textContent=tr_('days')[i]);
  spdEls.forEach((b,n)=>b.title=tr_('spd')[n]);
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  const lt=document.getElementById('langt');if(lt)lt.textContent=tr_('lang');
  if(S.over)document.getElementById('ot').innerHTML=tr_('over',S.score);
  if(!S.over&&(!document.getElementById('msg').textContent||document.getElementById('msg').dataset.def))
    {const m=document.getElementById('msg');m.textContent=tr_('hint');m.dataset.def='1'}
  clockUI();ui();
}
function setLang(l){LANG=l;try{localStorage.setItem('om_lang',l)}catch(e){}applyLang()}
function openMenu(){
  inMenu=true;lvCanvases.forEach((c,i)=>drawPreview(c,LEVELS[i]));
  document.getElementById('menu').style.display='flex';
}
function startLevel(i){
  RIVERS=LEVELS[i].rivers;cam.x=0;cam.y=0;cam.z=1;drag=null;pan=null;
  reset();document.getElementById('menu').style.display='none';inMenu=false;setSpeed(1);
}
document.getElementById('mb').onclick=openMenu;
document.getElementById('rm').onclick=openMenu;
resize();reset();buildMenu();applyLang();openMenu();requestAnimationFrame(loop);
</script></body></html>
