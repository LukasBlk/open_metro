<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenMetro - Web browser metro game</title>
<style>
:root{--water:#c3dcec;--bg:#f4f1ea;--fg:#2a2a2a;--bar:#e6e1d5;--st:#fff;--bd:#c9c3b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--water:#2b4a62;--bg:#1c1d20;--fg:#e8e6e1;--bar:#2a2b30;--st:#1c1d20;--bd:#444650}}
:root[data-theme="dark"]{--water:#2b4a62;--bg:#1c1d20;--fg:#e8e6e1;--bar:#2a2b30;--st:#1c1d20;--bd:#444650}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#cv{flex:1;min-height:0;width:100%;display:block;cursor:pointer;touch-action:none}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:auto;display:flex;gap:8px;align-items:center;padding:8px 12px;pointer-events:none}
#top>*{pointer-events:auto}
.side{position:fixed;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--bar);border:1px solid var(--bd);border-radius:16px;touch-action:none;user-select:none}
.side:empty{display:none}
#left{left:max(8px,env(safe-area-inset-left,0px))}
#right{right:max(8px,env(safe-area-inset-right,0px));max-height:calc(100% - 190px);overflow-y:auto}
.tr{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:#000;cursor:grab;touch-action:none;font-size:15px;min-width:34px}
.tr b{font-weight:700;color:var(--fg)}
.tr.empty{color:#8a8f98;cursor:default}
.tr.empty b{color:#8a8f98}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tr:not(.empty){color:#fff}}
button{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.ln{flex:none;aspect-ratio:1;width:42px;height:42px;border-radius:50%;border:3px solid var(--bg);background:var(--c);color:#fff;font-weight:700;font-size:16px;padding:0}
@media (max-height:820px){#right{gap:6px;padding:8px}button.ln{width:34px;height:34px;font-size:14px}}
@media (max-height:640px){button.ln{width:28px;height:28px;font-size:12px;border-width:2px}}
button.ln.on{box-shadow:0 0 0 3px var(--fg)}
#hud{margin-right:auto;font-weight:600}
#msg{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);opacity:.7;font-size:12px;text-align:center;pointer-events:none;width:max-content;max-width:80%}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:36px;padding:16px;box-sizing:border-box;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--fg);text-align:center}
#ot{display:flex;flex-direction:column;align-items:center;gap:14px}
.ot1{font-size:clamp(40px,9vw,76px);font-weight:800;letter-spacing:-1px}
.ot2{display:flex;flex-direction:column;align-items:center;gap:2px}
.ot2 b{font-size:clamp(34px,7vw,56px);font-weight:800}
.ot2 span{font-size:16px;opacity:.65;font-weight:600}
#ob{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#ob button{font-size:18px;font-weight:700;padding:14px 30px;border-radius:14px;border:3px solid var(--fg);background:var(--st);color:var(--fg)}
#ob button:hover{background:var(--fg);color:var(--bg);box-shadow:0 0 0 4px var(--bd)}
#ob button#rs{background:var(--fg);color:var(--bg)}
#ob button#rs:hover{background:var(--st);color:var(--fg)}
#clock{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;user-select:none}
#cinfo{font-weight:600;font-size:13px}
#crow{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 14px}
#days{display:flex;gap:5px}
.dy{width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:2px solid var(--fg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(90deg,var(--bd) var(--p,0%),var(--st) var(--p,0%))}
.dy.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
#spd{display:flex;gap:4px}
#spd button{padding:0 8px;height:30px;min-width:32px;display:flex;align-items:center;justify-content:center}

@media (max-width:640px){.dy{width:24px;height:24px;font-size:9px}#days{gap:3px}}
#rw{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#rwc{background:var(--bar);color:var(--fg);padding:24px 30px;border-radius:18px;border:1px solid var(--bd);text-align:center;display:flex;flex-direction:column;gap:6px}
#rwt{font-size:24px;font-weight:700}
#rwn{font-size:15px;font-weight:600;margin-top:4px}
#rws{font-size:15px;opacity:.75;margin-top:10px}
#rwb{display:flex;gap:14px;margin-top:14px;justify-content:center}
.rb{width:88px;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:0}
.rb:hover{background:var(--bd)}
.rbw{display:flex;flex-direction:column;align-items:center;gap:8px}
.rbl{font-size:13px;font-weight:600;opacity:.75}
.tr.static{cursor:default}
#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px))}
#menu{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:16px;box-sizing:border-box;overflow:auto}
#acb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));font-weight:700;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
#acc{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#acc .card{background:var(--st);border:3px solid var(--fg);border-radius:18px;padding:22px;width:min(380px,100%);max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
#acc h2{margin:0 0 4px;font-size:22px}
#acc input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
#acc .pri{background:var(--fg);color:var(--bg);font-weight:700;padding:11px;border-radius:12px;border:3px solid var(--fg)}
#acc .lnk{background:none;border:none;padding:2px;text-decoration:underline;font-size:13px;text-align:left;opacity:.85}
#acc .err{color:#e3302b;font-weight:600;font-size:13px;min-height:0}
#acc .note,#acc .priv{font-size:13px;opacity:.8;line-height:1.4}
#acc .row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cw{position:relative}
.lv.locked canvas{opacity:.28;filter:grayscale(1)}
.lv.locked{cursor:not-allowed}
.lk{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.lv.locked .lk{display:flex}
.lsub{font-size:12px;font-weight:600;opacity:.7;min-height:15px;text-align:center;max-width:160px;line-height:1.25;margin-top:-4px}
#mt{font-size:clamp(34px,6.5vw,60px);font-weight:800;letter-spacing:-1px}
#carw{display:flex;align-items:center;gap:6px;width:min(100%,1100px)}
#car{flex:1;overflow:hidden;position:relative;padding:26px 0 18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);touch-action:pan-y;user-select:none}
#track{display:flex;gap:34px;position:relative;width:max-content;transition:transform .3s ease}
.ca{flex:none;width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;padding:0 0 3px;font-weight:700}
.ca:disabled{opacity:.25;cursor:default}
.lv{flex:none;width:150px;opacity:.5;transform:scale(.8);transition:transform .3s ease,opacity .3s ease}
.lv.sel{opacity:1;transform:scale(1.18)}
#lbw{display:none;flex-direction:column;align-items:center;gap:8px;width:min(100%,640px)}
#lbt{font-weight:800;font-size:15px;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
#lb{font-size:14px;opacity:.85;text-align:center}
#lb.grid{display:grid;grid-template-rows:repeat(10,auto);grid-auto-flow:column;column-gap:28px;width:100%;text-align:left;opacity:1}
#lb .r{display:flex;gap:8px;padding:3px 6px;border-radius:6px;align-items:baseline}
#lb .r.me{background:var(--st);font-weight:800;outline:2px solid var(--fg)}
#lb .rk{width:24px;text-align:right;opacity:.6;font-variant-numeric:tabular-nums}
#lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .sc{font-variant-numeric:tabular-nums;font-weight:700}
#lb .nt{grid-column:1/-1;text-align:center;opacity:.6;font-size:13px;padding-top:6px}
@media (max-width:560px){#lb.grid{grid-template-rows:none;grid-auto-flow:row;max-height:260px;overflow:auto}}

.lv{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:none;border:none;padding:0}
.lv canvas{width:150px;height:150px;border:3px solid var(--fg);border-radius:14px;background:var(--st);display:block}
.lv.sb canvas{border:6px solid;border-image:repeating-linear-gradient(-45deg,#f5c400 0 12px,#161616 12px 24px) 6;border-radius:0;box-sizing:border-box}
.lv:hover canvas{box-shadow:0 0 0 4px var(--bd)}
.lv span{font-size:18px;font-weight:700}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
#rw,#over,#menu{animation:fadeIn .25s ease}
#rwc{animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
#rw.out{animation:fadeOut .22s ease forwards}
button{transition:background .15s,box-shadow .15s,border-color .15s,color .15s}
#lang{display:flex;gap:8px;align-items:center;font-size:14px}#lang span{opacity:.6;margin-right:4px}#lang button{font:inherit;padding:6px 12px;border-radius:8px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.6}#lang button.on{opacity:1;font-weight:700}
#credit{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.5;pointer-events:none;z-index:50;text-align:right}
#tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(44px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:14px;max-width:min(560px,calc(100% - 200px));background:var(--bar);color:var(--fg);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:40;animation:pop .3s ease}
#tutn{font-weight:800;font-size:13px;opacity:.6;white-space:nowrap}
#tutt{font-size:15px;font-weight:600;line-height:1.35}
#tutb{display:flex;gap:8px}
#tutb button{font-size:13px;font-weight:700;padding:6px 12px;border-radius:10px;white-space:nowrap}
#tut.ok{border-color:#1fa04a;box-shadow:0 0 0 2px #1fa04a}
@keyframes tutp{0%{box-shadow:0 0 0 0 rgba(245,184,0,.9)}100%{box-shadow:0 0 0 14px rgba(245,184,0,0)}}
.tutp{animation:tutp 1.2s infinite;border-radius:12px}
button.ln.tutp{border-radius:50%}
.lv.tut canvas{display:block}
#ver{position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.5;pointer-events:none;z-index:50}
</style></head><body>
<canvas id="cv"></canvas>
<div id="clock"><div id="cinfo"></div><div id="crow"><div id="days"></div><div id="spd"></div></div></div>
<button id="mb">Menu</button>
<div id="left" class="side"></div><div id="right" class="side"></div>
<div id="msg" data-def="1">Pick a line on the right and drag between stations. Drag trains from the left panel onto a line.</div>
<div id="over"><div id="ot"></div><div id="ob"><button id="rs">Hrát znovu</button><button id="rm">Menu</button></div></div>
<div id="rw"><div id="rwc"><div id="rwt">Week completed!</div><div id="rwn">You received a new locomotive</div><div id="rws">Choose reward</div><div id="rwb"></div></div></div>
<div id="ver">v0.83</div>
<div id="credit">Made by BLK in Czech Republic - 2026</div>
<div id="toast"></div><div id="acc"></div>
<div id="menu"><button id="acb"></button><div id="mt">OpenMetro</div><div id="carw"><button class="ca" id="cl" aria-label="‹">‹</button><div id="car"><div id="track"></div></div><button class="ca" id="cr" aria-label="›">›</button></div><div id="lbw"><div id="lbt"></div><div id="lb"></div></div><div id="lang"></div></div>
<div id="tut"><div id="tutn"></div><div id="tutt"></div><div id="tutb"></div></div>
<script>
// barvy linek podle pražského metra: A zelená, B žlutá, C červená, D modrá; zbytek vlastní
const COL=['#1fa04a','#f5b800','#e3302b','#1565c0','#8e4fc4','#f08a24','#1fb5b0','#e05fa0','#8b5a2b','#5b6270'],MAXL=6,CAP=8,VMAX=110,ACC=240,VMIN=14,R=15,MAXS=80;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),bar=document.getElementById('bar');
let W,H,S,adj,paused=false,last=0,FDT=.016,DPR=1,cam={x:0,y:0,z:1};
function resize(){const d=DPR=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);if(S&&S.lines)ui()}
addEventListener('resize',resize);
new ResizeObserver(resize).observe(cv);
const pos=s=>[s.fx*W,s.fy*H];

function reset(){
  S={t:0,score:0,stations:[],lines:COL.slice(0,3).map((c,i)=>({i,c,st:[],trains:[]})),pool:3,sel:0,spawnP:1,spawnS:20,poolT:0,over:false,ghosts:[],fx:[],weeksDone:0,reward:false,tunnels:2};
  for(let i=0;i<4;i++)addStation(true);
  segAnim.clear();buildAdj();document.getElementById('over').style.display='none';document.getElementById('rw').style.display='none';ui();
}
const SPECIAL=['d','p','x','a']; // odemykají se po 1., 2., 3. a 4. týdnu
function addStation(init){
  const n=S.stations.length,act=['c','t','s'],uns=SPECIAL.slice(0,Math.min(SPECIAL.length,S.weeksDone));
  // oblast roste pomalu (třetinově), nová stanice vzniká poblíž stávající sítě; občas (~20 %) dál, jako předměstí
  const g=Math.min(2.5,Math.max(1,Math.pow((n+1)/9,.33)));
  const far=!init&&n>=4&&Math.random()<.2,lo=init?90:far?220:115,hi=init?1e9:far?380:215;
  let pick=null,fb=null,fbs=1e9;
  for(let k=0;k<150&&!pick;k++){
    const fx=init?.3+Math.random()*.4:.5+(Math.random()-.5)*.76*g,fy=init?.3+Math.random()*.4:.5+(Math.random()-.5)*.8*g;
    if(nearWater(fx*W,fy*H))continue;
    let md=1e9;for(const o of S.stations)md=Math.min(md,Math.hypot((o.fx-fx)*W,(o.fy-fy)*H));
    if(md<90)continue;
    if(md>=lo&&md<=hi)pick={fx,fy};
    else{const sc=md<lo?lo-md:md-hi;if(sc<fbs){fbs=sc;fb={fx,fy}}}
  }
  if(!pick)pick=fb||{fx:.5+(Math.random()-.5)*.6,fy:.5+(Math.random()-.5)*.6};
  const {fx,fy}=pick;
  let sh;
  if(n<3)sh=act[n];
  else{
    const fresh=uns.find(x=>!S.stations.some(o=>o.shape===x));
    if(fresh)sh=fresh;
    else{const pool=[...act,...uns],w=pool.map(x=>act.includes(x)?1:.6);let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<pool.length-1&&r>=w[i]){r-=w[i];i++}sh=pool[i]}
  }
  S.stations.push({fx,fy,shape:sh,pax:[],over:0,sp:init?undefined:0});
}
function buildAdj(){
  adj=S.stations.map(()=>new Set());
  for(const L of S.lines)for(let i=0;i<nseg(L);i++){const a=L.st[i],b=sb(L,i);adj[a].add(b);adj[b].add(a)}
}
// pomocné funkce pro linky a smyčky
function nseg(L){const n=L.st.length;return n<2||L.dying?0:L.loop?n:n-1}
function sb(L,i){return L.st[(i+1)%L.st.length]}
function adjIdx(L,x,y){const n=L.st.length,d=Math.abs(x-y);return d===1||(!!L.loop&&n>2&&d===n-1)}
function nearOn(p,mx,my){
  let best=null,acc=0;const tot=plen(p)||1;
  for(let k=0;k<p.length-1;k++){
    const a=p[k],b=p[k+1],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy,l=Math.sqrt(l2);
    if(l<1e-6)continue;
    const t=Math.max(0,Math.min(1,((mx-a[0])*dx+(my-a[1])*dy)/l2)),cx=a[0]+dx*t,cy=a[1]+dy*t,d=Math.hypot(mx-cx,my-cy);
    if(!best||d<best.d)best={d,f:(acc+l*t)/tot,side:Math.sign(dx*(my-cy)-dy*(mx-cx)),x:cx,y:cy,ang:Math.atan2(dy,dx)};
    acc+=l;
  }
  return best;
}
function lineAt(mx,my,maxD){
  let best=null;
  for(const L of S.lines)for(let i=0;i<nseg(L);i++){
    const r=nearOn(route(L,L.st[i],sb(L,i)),mx,my);
    if(r&&r.d<maxD&&(!best||r.d<best.d))best={...r,L,i};
  }
  return best;
}
function placeOn(tr,h,old){
  const st=h.L.st,fwd=h.side>=0,i=h.i,f=Math.max(.02,Math.min(.98,h.f));
  const nb=sb(h.L,i);endGhost(tr);
  tr.a=fwd?st[i]:nb;tr.b=fwd?nb:st[i];tr.t=fwd?f:1-f;tr.wait=0;tr.rm=false;tr.sk=undefined;
  if(old!==h.L){if(old)old.trains.splice(old.trains.indexOf(tr),1);h.L.trains.push(tr)}
}
function endPv(d){
  const h=d.hit;
  if(d.tr){
    d.tr.held=false;
    if(d.moved){d.tr.rm=true;if(h){const st=h.L.st,fwd=h.side>=0,i=h.i,f=Math.max(.02,Math.min(.98,h.f));{const nb=sb(h.L,i);d.tr.mv={L:h.L,a:fwd?st[i]:nb,b:fwd?nb:st[i],t:fwd?f:1-f}}}else d.tr.mv=null}
  }else if(h&&S.pool>0){placeOn({pax:[]},h,null);S.pool--}
  ui();
}
function validMv(m){const s=m.L.st,x=s.indexOf(m.a),y=s.indexOf(m.b);return x>=0&&y>=0&&adjIdx(m.L,x,y)}
function endGhost(tr){const G=tr.g;tr.g=null;if(G&&--G.n<=0)S.ghosts=S.ghosts.filter(x=>x!==G)}
function dseg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function segAt(mx,my){
  let best=null,bd=11;
  for(const L of S.lines)for(let i=0;i<nseg(L);i++){
    const p=route(L,L.st[i],sb(L,i));
    for(let k=0;k<p.length-1;k++){const d=dseg(mx,my,p[k],p[k+1]);if(d<bd){bd=d;best={L,i}}}
  }
  return best;
}
function insertSeg(h,X){
  const L=h.L,i=h.i,a=L.st[i],b=sb(L,i);

// vybere pro celou linku varianty úseků s nejmenším součtem zlomů (dynamické programování, u smyčky i s uzavřením)
function solveVariants(L){

    const best=[],from=[];

      best[j]=[INF,INF];from[j]=[0,0];
      for(let c=0;c<2;c++)for(let p=0;p<2;p++){
        const v=best[j-1][p]+pairCost(L,j-1,p,j,c);

function fitCam(dt,snap){
  const t=camTarget(),k=snap?1:1-Math.exp(-dt*2.2);
  cam.z+=(t.z-cam.z)*k;cam.x+=(t.x-cam.x)*k;cam.y+=(t.y-cam.y)*k;
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;FDT=dt;
  // při pauze se čas nehýbe (dt=0), ale logika úprav sítě dál doběhne (mizení linek, duchové úseky, ...)
  if(!S.over&&!S.reward&&!inMenu)update(speed>0?dt*MULT[speed]:0);
  if(TUT&&!inMenu)tutTick(dt);
  if(!inMenu)fitCam(dt);
  draw();requestAnimationFrame(loop);
}

function toS(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function toW(e){const [sx,sy]=toS(e);return [(sx-cam.x)/cam.z,(sy-cam.y)/cam.z]}

function stAt(e,skip){
  const [mx,my]=toW(e);
  let best=-1,bd=R+14;
  S.stations.forEach((s,i)=>{const [x,y]=pos(s),d=Math.hypot(x-mx,y-my);if(d<bd&&i!==skip){bd=d;best=i}});
  return [best,mx,my];
}
cv.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  if(S.over)return;
  const [id,mx,my]=stAt(e,-1),L0=S.lines[S.sel],n0=L0.st.length;
  for(const L of S.lines)for(const tr of L.trains){
    if(tr.t<=0||L.st.length<2||!S.stations[tr.a]||!S.stations[tr.b])continue;
    const [x,y]=at(route(L,tr.a,tr.b),tr.t);
    if(Math.hypot(x-mx,y-my)<16){tr.held=true;drag={pv:true,tr,L,from:-1,hover:-1,sx:mx,sy:my,moved:false,x:mx,y:my,hit:lineAt(mx,my,40)};cv.setPointerCapture(e.pointerId);e.preventDefault();return}
  }
  if(L0.dying&&id>=0&&L0.st.includes(id)){msg(tr_('dying'));return}
  if(id>=0&&L0.loop&&L0.st.includes(id)){
    drag={from:id,loopOpen:true,x:mx,y:my,hover:-1,moved:false};cv.setPointerCapture(e.pointerId);e.preventDefault();return;
  }
  if(id>=0&&(n0===0||L0.st[0]===id||L0.st[n0-1]===id)){
    drag={from:id,x:mx,y:my,hover:-1,moved:false};
  }else{
    const h=segAt(mx,my);
    if(!h){if(id>=0)msg(tr_('extend'));return}
    S.sel=h.L.i;ui();
    drag={seg:h,from:-1,x:mx,y:my,hover:-1,moved:true};
  }
  cv.setPointerCapture(e.pointerId);e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.pv){[drag.x,drag.y]=toW(e);if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>8)drag.moved=true;drag.hit=lineAt(drag.x,drag.y,40);return}
  const [id,mx,my]=stAt(e,drag.from),L=S.lines[S.sel];
  drag.x=mx;drag.y=my;
  if(drag.from>=0){const P=pos(S.stations[drag.from]);if(Math.hypot(mx-P[0],my-P[1])>R)drag.moved=true}
  const n=L.st.length;
  drag.hover=drag.loopOpen?-1:(id>=0&&!L.st.includes(id)?id:-1);
  if(!drag.loopOpen&&!L.loop&&n>=3&&id>=0&&((drag.from===L.st[0]&&id===L.st[n-1])||(drag.from===L.st[n-1]&&id===L.st[0])))drag.hover=id;
  if(!drag.loopOpen&&id>=0&&L.st.includes(id)&&!L.dying){if(drag.remId!==id){drag.remId=id;drag.remT=performance.now()}}else drag.remId=-1;
});
cv.addEventListener('pointerup',()=>{
  if(!drag)return;
  const d=drag,L=S.lines[S.sel],n=L.st.length;drag=null;
  if(d.pv){endPv(d);return}
  if(d.remId>=0&&d.hover!==d.remId){removeSt(L,d.remId);buildAdj();ui();return}
  if(d.seg){if(d.hover>=0)insertSeg(d.seg,d.hover);buildAdj();ui();return}
  if(d.loopOpen){if(!d.moved)L.loop=false;buildAdj();ui();return}
  if(d.hover>=0){
    const ns=L.st.slice();let nl=L.loop,act=0;
    if(L.st.includes(d.hover)){if(n>=3){nl=true;act=1}}
    else if(n===0){ns.push(d.from,d.hover);act=2}
    else if(L.st[n-1]===d.from){ns.push(d.hover);act=3}
    else{ns.unshift(d.hover);act=4}
    if(act&&canChange(L,ns,nl)){
      if(act===1)L.loop=true;
      else{
        L.st=ns;
        if(act===2&&S.pool>0&&!L.trains.length){S.pool--;L.trains.push({a:d.from,b:d.hover,t:0,wait:.3,pax:[]})}
      }
    }
  }else if(!d.moved&&n>0){
    if(n<=2)L.st=[];else if(L.st[n-1]===d.from)L.st.pop();else L.st.shift();
  }
  buildAdj();ui();
});

  if(TUT.step===1&&TUT.okT<=0){const L=S.lines.find(L=>L.st.length>=2);if(L)TUT.hl=[L.st[L.st.length-1],2]}
  if(TUT.step===4&&TUT.okT<=0){const L=S.lines.find(L=>L.st.length>=3),T=S.stations[3];TUT.seg=null;if(L){let bd=1e9;for(let i=0;i+1<L.st.length;i++){const a=S.stations[L.st[i]],b=S.stations[L.st[i+1]],d=Math.hypot((a.fx+b.fx)/2-T.fx,(a.fy+b.fy)/2-T.fy);if(d<bd){bd=d;TUT.seg={L,a:L.st[i],b:L.st[i+1]}}}}}else TUT.seg=null;

function accRender(){
  const box=document.getElementById('acc');if(!box||box.style.display!=='flex')return;
  box.innerHTML='';const card=el('div','card');box.appendChild(card);
  box.onclick=e=>{if(e.target===box)accClose()};
  const inp=(type,ph,val,on,ac)=>{const i=el('input');i.type=type;i.placeholder=ph;i.value=val;i.autocomplete=ac;i.oninput=()=>on(i.value);i.onkeydown=e=>{if(e.key==='Enter')go&&go()};return i};
  let go=null;
  const mk=(t,fn)=>{const b=el('button','pri',t);b.disabled=AC.busy;b.onclick=fn;go=fn;return b};
  const lnk=(t,fn)=>{const b=el('button','lnk',t);b.onclick=fn;return b};
  let pw='';
  if(AC.mode==='user'){
    card.append(el('h2','',AC.user.name),el('div','note',tr_('signedAs')+' '+AC.user.email));
    card.append(mk(tr_('logout'),()=>accRun(async()=>{await OMA.signOut();PROG={best:{}};progStore();menuRefresh();accClose()})));
    card.querySelector('.pri').style.background='var(--st)';card.querySelector('.pri').style.color='var(--fg)';
    card.append(inp('text',tr_('nick'),AC.nick||AC.user.name,v=>{AC.nick=v},'nickname'));
    card.append(lnk(tr_('saveNick'),()=>accRun(async()=>{const n=(AC.nick||'').trim();if(n.length<2||n.length>20){AC.err=tr_('nickBad');return}await OMA.setNick(n);AC.nick='';AC.note=tr_('nickSaved')})));
    card.append(lnk(tr_('delAcc'),()=>{AC.mode='del';AC.err='';accRender()}));
  }else if(AC.mode==='del'){
    card.append(el('h2','',tr_('delAcc')),el('div','note',tr_('delWarn')));
    card.append(inp('password',tr_('password'),'',v=>{pw=v},'current-password'));
    card.append(mk(tr_('delBtn'),()=>accRun(async()=>{await OMA.del(pw);PROG={best:{}};progStore();menuRefresh();accClose()})));
    card.append(lnk(tr_('cancel'),()=>{AC.mode='user';AC.err='';accRender()}));
  }else{
    const up=AC.mode==='up';
    card.append(el('h2','',up?tr_('register'):tr_('login')));
    if(up)card.append(inp('text',tr_('nick'),AC.nick,v=>{AC.nick=v},'nickname'));
    card.append(inp('email',tr_('email'),AC.email,v=>{AC.email=v},'email'));
    card.append(inp('password',tr_('password'),'',v=>{pw=v},up?'new-password':'current-password'));
    card.append(mk(up?tr_('register'):tr_('login'),()=>accRun(async()=>{
      if(up){const n=AC.nick.trim();if(n.length<2||n.length>20){AC.err=tr_('nickBad');return}await OMA.signUp(AC.email.trim(),pw,n)}
      else await OMA.signIn(AC.email.trim(),pw);
      accClose()})));
    card.append(lnk(up?tr_('haveAcc'):tr_('noAcc'),()=>{AC.mode=up?'in':'up';AC.err='';accRender()}));
    if(!up)card.append(lnk(tr_('forgot'),()=>{if(!AC.email.trim()){AC.err=tr_('resetNeed');accRender();return}accRun(async()=>{await OMA.reset(AC.email.trim());AC.note=tr_('resetSent')})}));
    card.append(el('div','note',tr_('accNote')));
  }
  if(AC.err)card.append(el('div','err',AC.err));
  if(AC.note)card.append(el('div','note',AC.note));
  const row=el('div','row');
  row.append(lnk(tr_('privacy'),()=>{AC.priv=!AC.priv;accRender()}),lnk(tr_('close'),accClose));
  card.append(row);
  if(AC.priv)card.append(el('div','priv',tr_('privTxt')+(PRIV_MAIL?' '+PRIV_MAIL:'')));
}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail,updateProfile,deleteUser,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,updateDoc,collection,query,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCCH88hIE9AItoxnpc6RLtbNpLNb-eIbao",authDomain:"openmetro.firebaseapp.com",projectId:"openmetro",storageBucket:"openmetro.firebasestorage.app",messagingSenderId:"1026816063656",appId:"1:1026816063656:web:e1ca20d08a1389a1a76a9d"});
const auth=getAuth(app),db=getFirestore(app);
const MAPS=['desert','usti','praha','brno','cb','plzen'];
const nameOf=u=>u.displayName||(u.email||'').split('@')[0];
const ref=u=>doc(db,'players',u.uid);
const emit=(user,remote)=>dispatchEvent(new CustomEvent('oma-user',{detail:{user:user?{name:nameOf(user),email:user.email,uid:user.uid}:null,remote}}));
const OMA={
  user:null,
  signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p),
  async signUp(e,p,n){const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});emit(c.user)},
  async setNick(n){const u=auth.currentUser;await updateProfile(u,{displayName:n});for(const k of MAPS){try{await updateDoc(doc(db,'scores',k,'entries',u.uid),{name:n})}catch(e){}}for(const k in OMA.sent)delete OMA.sent[k];emit(u)},
  signOut:()=>signOut(auth),
  reset:e=>sendPasswordResetEmail(auth,e),
  sent:{},
  async save(b){const u=OMA.user;if(!u)return;await setDoc(ref(u),{best:b},{merge:true});
    for(const k of MAPS){const v=b[k]||0;if(v>0&&OMA.sent[k]!==v){try{await setDoc(doc(db,'scores',k,'entries',u.uid),{name:nameOf(u),score:v});OMA.sent[k]=v}catch(e){console.warn('score submit failed',k,e)}}}},
  async top(m){const r=await getDocs(query(collection(db,'scores',m,'entries'),orderBy('score','desc'),limit(20)));return r.docs.map(d=>({uid:d.id,name:d.data().name,score:d.data().score}))},
  async del(pw){const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,pw));for(const k of MAPS){try{await deleteDoc(doc(db,'scores',k,'entries',u.uid))}catch(e){}}try{await deleteDoc(ref(u))}catch(e){}await deleteUser(u)}
};
window.OMA=OMA;
onAuthStateChanged(auth,async u=>{
  OMA.user=u;OMA.sent={};
  if(!u){emit(null);return}
  let remote=null;
  try{const d=await getDoc(ref(u));remote=d.exists()?(d.data().best||{}):{}}catch(e){console.warn('progress load failed',e)}
  emit(u,remote);
});
</script>
